server:
  port: 8090
  # Set FORWARD_HEADERS_STRATEGY=native only when running behind a trusted reverse proxy.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

spring:
  application:
    name: duemet-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DATABASE_URL:}
    username: ${DATABASE_USER:}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 60000

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  # Zone the JVM runs in; booking wall-clock times are interpreted in this zone.
  timezone: ${APP_TIMEZONE:Asia/Karachi}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  security:
    # Mark session cookies Secure (HTTPS only). Set true in any deployed environment.
    cookie-secure: ${COOKIE_SECURE:false}
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: ${JWT_EXPIRATION_MS:900000}
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  upload:
    dir: ${UPLOAD_DIR:uploads}
  r2:
    endpoint: ${R2_ENDPOINT:}
    region: ${STORAGE_REGION:auto}
    access-key: ${R2_ACCESS_KEY:}
    secret-key: ${R2_SECRET_KEY:}
    bucket-name: ${R2_BUCKET_NAME:}
    public-url: ${R2_PUBLIC_URL:}
    path-style-access: true
    chunked-encoding: false
    folders:
      verification: verification
      profile: profile
      categories: categories
      request-media: request_media
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    commission-percentage: 0.0
  push:
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
    # Contact for push services: mailto: address or https: site URL. Defaults to the frontend URL.
    vapid-subject: ${VAPID_SUBJECT:}
  whatsapp:
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}
    app-secret: ${WHATSAPP_APP_SECRET:}

logging:
  config: classpath:log4j2-spring.xml

---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    enabled: true
  jpa:
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
app:
  otp:
    # Print sign-in codes in the dev log so you can test without working email.
    log-codes: true

---
spring:
  config:
    activate:
      on-profile: prod
  flyway:
    enabled: true
