server:
  port: 8090

spring:
  application:
    name: hourslot-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DATABASE_URL:}
    username: ${DATABASE_USER:}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: true
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 60000

  # Set MAIL_HOST / MAIL_PORT / MAIL_USERNAME / MAIL_PASSWORD to enable SMTP.
  # Spring Boot auto-configures JavaMailSender when spring.mail.host is present.

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  security:
    jwt:
      secret: ${JWT_SECRET:}
      expiration-ms: 86400000
      refresh-expiration-ms: 604800000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  upload:
    dir: ${UPLOAD_DIR:uploads}
  r2:
    endpoint: ${R2_ENDPOINT:}
    access-key: ${R2_ACCESS_KEY:}
    secret-key: ${R2_SECRET_KEY:}
    bucket-name: ${R2_BUCKET_NAME:hourslot-media}
    public-url: ${R2_PUBLIC_URL:}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    commission-percentage: 0.0

logging:
  config: classpath:log4j2-spring.xml

