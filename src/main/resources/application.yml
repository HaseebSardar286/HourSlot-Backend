server:
  port: 8090

spring:
  application:
    name: hourslot-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DATABASE_URL:}
    username: ${DATABASE_USER:}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 60000

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: 86400000
      refresh-expiration-ms: 604800000 
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  upload:
    dir: ${UPLOAD_DIR:uploads}
  r2:
    endpoint: ${R2_ENDPOINT:}
    region: ${STORAGE_REGION:auto}
    access-key: ${R2_ACCESS_KEY:}
    secret-key: ${R2_SECRET_KEY:}
    bucket-name: ${R2_BUCKET_NAME:}
    public-url: ${R2_PUBLIC_URL:}
    path-style-access: true
    chunked-encoding: false
    folders:
      verification: verification
      business-profile: bussiness_profile
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    commission-percentage: 0.0

logging:
  config: classpath:log4j2-spring.xml

---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

---
spring:
  config:
    activate:
      on-profile: prod
  flyway:
    enabled: true
