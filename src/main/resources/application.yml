server:
  port: 8080

spring:
  application:
    name: hourslot-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DATABASE_URL:}
    username: ${DATABASE_USER:}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 60000

app:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      expiration-ms: 86400000
      refresh-expiration-ms: 604800000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  upload:
    dir: ${UPLOAD_DIR:uploads}
  r2:
    endpoint: ${R2_ENDPOINT:}
    access-key: ${R2_ACCESS_KEY:}
    secret-key: ${R2_SECRET_KEY:}
    bucket-name: ${R2_BUCKET_NAME:hourslot-media}
    public-url: ${R2_PUBLIC_URL:}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    commission-percentage: 10.0

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # Defaults to your Neon DB (same as before). Override with DATABASE_* env vars if needed.
    url: ${DATABASE_URL:jdbc:postgresql://ep-rough-lab-ay5c9073.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require}
    username: ${DATABASE_USER:neondb_owner}
    password: ${DATABASE_PASSWORD:npg_TKPjdIqb34rC}
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
  data:
    redis:
      # Slot locks degrade gracefully if Redis is down (see SlotLockService)
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  security:
    jwt:
      # Dev-only fallback (Base64). Override with JWT_SECRET in real environments.
      secret: ${JWT_SECRET:OWFiYzEyMzRkZWY1Njc4OWFiYzEyMzRkZWY1Njc4OWFiYzEyMzRkZWY1Njc4OWFiYzEyMzRkZWY1Njc4OWFiYzEyMw==}

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
